<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0b1021" />
      <stop offset="100%" stop-color="#140f28" />
    </linearGradient>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />

  <!-- Ambient Glow Blobs -->
  <circle cx="250" cy="220" r="280" fill="#00f2fe" opacity="0.08" filter="blur(80px)" />
  <circle cx="950" cy="400" r="320" fill="#8b5cf6" opacity="0.1" filter="blur(90px)" />
  <circle cx="600" cy="550" r="250" fill="#f43f5e" opacity="0.07" filter="blur(70px)" />

  <!-- Hexagon Brand Mark Container -->
  <g transform="translate(140, 165)">
    <polygon points="120,12 214,66 214,174 120,228 26,174 26,66" 
             stroke="url(#logo-grad)" 
             stroke-width="5" 
             fill="rgba(11, 15, 25, 0.85)" 
             filter="url(#glow)" />
    <!-- Integral + Sigma Core Mark -->
    <path d="M 120,48 C 136,48 144,58 144,72 C 144,92 104,112 92,124 C 76,140 76,164 92,180 C 108,196 136,192 148,180" 
          stroke="url(#logo-grad)" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)" fill="none" />
    <path d="M 88,64 L 152,64 L 120,108 L 152,152" 
          stroke="url(#logo-grad)" 
          stroke-width="9" 
          stroke-linecap="round" 
          stroke-linejoin="round" fill="none" />
    <circle cx="120" cy="108" r="7" fill="#00f2fe" filter="url(#glow)" />
  </g>

  <!-- Wordmark -->
  <text x="420" y="275" font-family="'Orbitron', sans-serif" font-weight="900" font-size="88" fill="#ffffff" letter-spacing="-1">
    Calc<tspan fill="url(#logo-grad)">Verse</tspan>
  </text>
  <text x="425" y="340" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="30" fill="#38bdf8" letter-spacing="4">
    ADVANCED SCIENTIFIC &amp; SYMBOLIC CALCULATOR
  </text>
  <text x="425" y="390" font-family="'Inter', sans-serif" font-weight="400" font-size="22" fill="#94a3b8">
    Symbolic Calculus • Eigenvalues &amp; Matrices • Complex Numbers • GPU Plotter
  </text>

  <!-- Badge Strip -->
  <g transform="translate(425, 435)">
    <rect width="180" height="42" rx="10" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" />
    <text x="90" y="27" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" fill="#38bdf8" text-anchor="middle">∫ CALCULUS</text>

    <rect x="200" width="180" height="42" rx="10" fill="rgba(139, 92, 246, 0.12)" stroke="rgba(139, 92, 246, 0.3)" />
    <text x="290" y="27" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" fill="#a78bfa" text-anchor="middle">▦ MATRICES</text>

    <rect x="400" width="180" height="42" rx="10" fill="rgba(244, 63, 94, 0.12)" stroke="rgba(244, 63, 94, 0.3)" />
    <text x="490" y="27" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" fill="#fb7185" text-anchor="middle">📈 PLOTTER</text>
  </g>
</svg>
